[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qem"
version = "0.1.0"
description = "Quantitative Electron Microscopy: atomic-resolution STEM image quantification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Zezhong Zhang", email = "zezhong.zhang@uantwerpen.be" },
]
keywords = ["stem", "electron-microscopy", "atomic-resolution", "image-fitting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# Core runtime dependencies. Anything that is only needed for the GUI,
# notebook, deep-learning, or specialised IO paths lives in extras below
# so that headless library use stays installable.
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "matplotlib>=3.6",
    "matplotlib-scalebar>=0.8",
    "Pillow>=9.0",
    "h5py>=3.0",
    "tqdm>=4.60",
    "scikit-image>=0.20",
    "scikit-learn>=1.2",
    "shapely>=2.0",
    "numba>=0.57",
    "ase>=3.22",
    "torch>=2.0",
    "matscipy>=1.0",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/zezhong-zhang/qem"
Issues = "https://github.com/zezhong-zhang/qem/issues"

[project.scripts]
qem-app = "qem.viz.napari_app:run_app"

[project.optional-dependencies]
# GUI desktop app (napari) + interactive notebook plotters (plotly).
gui = [
    "napari[pyqt5]>=0.5",
    "magicgui>=0.8",
    "plotly>=5.18",
    "imageio>=2.31",
]
# Specialised IO formats that pull in heavy science stacks.
io = [
    "hyperspy>=2.0",
    "rosettasciio>=0.4",
]
# Notebook / Jupyter usage.
notebook = [
    "jupyter>=1.0",
    "jupyterlab>=4.0",
    "ipywidgets>=8.0",
]
# Computer vision / image utilities used by some processing paths.
cv = [
    "opencv-python>=4.7",
]
# Documentation toolchain.
docs = [
    "sphinx>=7.0",
    "sphinx_rtd_theme>=2.0",
    "myst-parser>=2.0",
]
# Developer toolchain (tests, lint, build).
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-benchmark>=4.0",
    "nbmake>=1.5",
    "build>=1.0",
    "black>=24.0",
    "ruff>=0.5",
]
# Convenience meta-extra: install everything optional.
all = [
    "qem[gui,io,notebook,cv,docs,dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["qem*"]
exclude = ["tests*", "examples*", "docs*", "gallery*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous variable names (eV, df, etc. are physics-conventional)
    "B008",  # function call in default argument (pytest fixtures)
]
exclude = [
    "qem/io/dm.py",   # external file format parser, modernise in Phase 4
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401", "F811"]
"examples/*" = ["E402", "F401"]
"qem/__init__.py" = ["F401", "F403"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

