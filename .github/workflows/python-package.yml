# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # requires-python = ">=3.11" in pyproject.toml; matrix must stay in range.
        python-version: ["3.11", "3.12", "3.13"]
        platform: [cpu]
        # include:
        #   - python-version: "3.11"
        #     platform: gpu

    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install GCC 11
      if: matrix.platform == 'gpu'
      run: |
        sudo apt update
        sudo apt install -y gcc-11 g++-11
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100
        gcc --version

    - name: Setup GPU (if needed)
      if: matrix.platform == 'gpu'
      uses: Jimver/cuda-toolkit@v0.2.21
      with:
        # Using CUDA 12.1 to match the pre-built PyTorch wheels
        cuda: '12.1.0' 
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest pytest-cov
        # Install git so we can install from git repositories
        sudo apt-get update && sudo apt-get install -y git
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Install PyTorch with appropriate backend
        if [ "${{ matrix.platform }}" = "gpu" ]; then
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121
        else
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        fi
        # Install the package with dev dependencies
        pip install -e ".[dev]"
    
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test with pytest
      run: |
        python -m pytest tests/ --cov=qem --cov-report=xml -v

    - name: Smoke-test example .py modules
      run: |
        # Strict: any example that errors on import fails CI. Examples
        # ship as importable modules — no main() runner — so a clean
        # import is the contract.
        python -c "
        import importlib, glob, os, sys
        sys.path.insert(0, 'examples')
        failures = []
        for path in sorted(glob.glob('examples/*.py')):
            mod = os.path.splitext(os.path.basename(path))[0]
            try:
                importlib.import_module(mod)
                print('imported', mod)
            except Exception as exc:
                print('SMOKE FAIL', mod, '->', exc)
                failures.append((mod, exc))
        if failures:
            sys.exit('Example smoke failed: ' + ', '.join(m for m, _ in failures))
        "

    - name: Smoke-test example notebooks (best-effort)
      run: |
        # Notebooks often need test data not in the repo, so failures
        # surface as GitHub warnings rather than CI failures. nbmake's
        # --nbmake-kernel=python3 keeps things portable across runners.
        pip install nbmake
        for nb in examples/*.ipynb; do
          [ -e "$nb" ] || continue
          echo "Smoke testing $nb"
          python -m pytest --nbmake --nbmake-kernel=python3 \
            --nbmake-timeout=60 "$nb" || \
            echo "::warning file=$nb::notebook smoke failed (likely missing data)"
        done

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false
        flags: ${{ matrix.platform }}_py${{ matrix.python-version }}
        name: coverage-${{ matrix.platform }}-python${{ matrix.python-version }}-${{ github.run_id }}
        verbose: true
